# Checks for the PHP backend (see specs/backend-plan.md, item 0.4).
# Runs the unit and API test layers only; the end-to-end tests need a ChurchTools instance and are run by hand.
name: Backend

on:
  push:
    paths:
      - 'backend/**'
      # The parity fixtures the backend tests read too (shared/*.json).
      - 'shared/**'
      # The contract sandbox wraps the backend's ChurchTools client; its guard test needs PHP and vendor/ (below).
      - 'extension/tests/contract/sandbox/**'
      - 'extension/tests/contract/sandbox-overrides.unit.test.ts'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      # The parity fixtures the backend tests read too (shared/*.json).
      - 'shared/**'
      # The contract sandbox wraps the backend's ChurchTools client; its guard test needs PHP and vendor/ (below).
      - 'extension/tests/contract/sandbox/**'
      - 'extension/tests/contract/sandbox-overrides.unit.test.ts'
      - '.github/workflows/backend.yml'

# Read only, explicitly.
permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, sodium
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Security audit
        run: composer audit

      # PHP-CS-Fixer only supports PHP versions it was released for; the style doesn't depend on the PHP version.
      - name: Code style
        if: matrix.php == '8.3'
        run: composer cs

      - name: Static analysis
        run: composer stan

      - name: Unit and API tests
        run: composer test

      # The contract sandbox's override guard (extension/tests/contract/sandbox-overrides.unit.test.ts) runs PHP
      # against vendor/; the extension job has no PHP and skips it, so it runs here. A skip would hide it, so the
      # step fails unless every test in the file ran and passed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Contract sandbox override guard
        working-directory: extension
        run: |
          npx vitest run tests/contract/sandbox-overrides.unit.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/sandbox-overrides.json"
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (r.numTotalTests === 0 || r.numPassedTests !== r.numTotalTests) {
              console.error(`sandbox override guard: ${r.numPassedTests} of ${r.numTotalTests} tests passed (skipped: ${r.numPendingTests + r.numTodoTests})`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/sandbox-overrides.json"
